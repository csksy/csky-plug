# Railway deploy config - deploy this folder directly on Railway
# (New Project -> Deploy from GitHub repo -> select the bridge folder)
# Requires env vars: API_ID, API_HASH  (from https://my.telegram.org)

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
